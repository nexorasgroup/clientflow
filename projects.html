<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projets — ClientFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
    .navbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 1rem;height:3.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
    .logo{font-size:1.25rem;font-weight:700;text-decoration:none;color:inherit}
    .logo span{color:#4f46e5}
    .menu-toggle{display:none;background:none;border:1px solid #e2e8f0;border-radius:.5rem;padding:.35rem .6rem;font-size:1.1rem;cursor:pointer}
    .nav-menu{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
    .nav-menu a{font-size:.72rem;color:#64748b;text-decoration:none;padding:.2rem .3rem}
    .btn{padding:.45rem .7rem;border-radius:.5rem;font-size:.75rem;font-weight:500;border:none;cursor:pointer;font-family:inherit}
    .btn-primary{background:#4f46e5;color:#fff}
    .btn-secondary{background:#fff;border:1px solid #e2e8f0;color:#334155}
    .btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .btn-sm{padding:.3rem .5rem;font-size:.7rem}
    main{max-width:56rem;margin:0 auto;padding:1.25rem 1rem 3rem}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
    h1{font-size:1.4rem}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:.78rem}
    th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid #e2e8f0}
    th{background:#f8fafc;color:#64748b;font-weight:500}
    .empty{text-align:center;padding:2.5rem 1rem;color:#64748b}
    .empty .icon{font-size:2rem;margin-bottom:.75rem}
    .badge{display:inline-block;padding:.15rem .4rem;border-radius:9999px;font-size:.7rem;font-weight:500}
    .badge-pending{background:#fef3c7;color:#b45309}
    .badge-in_progress{background:#dbeafe;color:#1d4ed8}
    .badge-completed{background:#d1fae5;color:#047857}
    .badge-cancelled{background:#fee2e2;color:#b91c1c}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:.75rem;width:100%;max-width:26rem;max-height:90vh;overflow-y:auto;padding:1.5rem}
    .modal h2{font-size:1.2rem;margin-bottom:1.1rem}
    label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.3rem;color:#334155}
    input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:.9rem;margin-bottom:.9rem;font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    .modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem}
    .error{background:#fef2f2;color:#dc2626;padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem;display:none}
    .reste{font-weight:600;color:#b45309}
    .reste-ok{color:#047857}
    @media(max-width:768px){
      .menu-toggle{display:block}
      .nav-menu{display:none;position:absolute;top:3.75rem;left:0;right:0;background:#fff;border-bottom:1px solid #e2e8f0;flex-direction:column;align-items:stretch;padding:.5rem 0;z-index:40}
      .nav-menu.open{display:flex}
      .nav-menu a{padding:.75rem 1.25rem;font-size:.9rem;border-bottom:1px solid #f1f5f9}
      .nav-menu .btn{margin:.5rem 1.25rem;width:calc(100% - 2.5rem);justify-content:center}
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="logo">Client<span>Flow</span></a>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Accueil</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="projects.html">Projets</a>
      <a href="finances.html">Finances</a>
      <a href="profile.html">Profil</a>
      <a href="plan.html">Plan</a>
      <button class="btn btn-secondary" id="logout-btn">Déconnexion</button>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h1>Projets</h1>
      <button class="btn btn-primary" id="btn-add">+ Nouveau projet</button>
    </div>
    <div id="error" class="error"></div>
    <div class="card">
      <div id="loading" style="padding:2rem;text-align:center;color:#64748b">Chargement...</div>
      <div id="table-wrap" style="display:none;overflow-x:auto">
        <table>
          <thead><tr><th>Titre</th><th>Client</th><th>Total</th><th>Avancé</th><th>Reste</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody id="projects-tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="display:none">
        <div class="icon">📁</div>
        <h3>Aucun projet</h3>
        <p>Créez votre premier projet.</p>
        <button class="btn btn-primary" id="btn-add-empty" style="margin-top:1rem">+ Nouveau projet</button>
      </div>
    </div>
  </main>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Nouveau projet</h2>
      <div id="modal-error" class="error"></div>
      <form id="project-form">
        <input type="hidden" id="project-id"/>
        <label>Titre *</label><input type="text" id="project-title" required/>
        <label>Client</label><select id="project-client"><option value="">— Aucun —</option></select>
        <label>Montant total (FCFA) *</label>
        <input type="number" id="project-amount" min="0" step="1" value="0" required placeholder="Ex: 1500000"/>
        <label>Montant avancé (FCFA)</label>
        <input type="number" id="project-paid" min="0" step="1" value="0" placeholder="Ex: 500000"/>
        <label>Description</label><textarea id="project-description" rows="2"></textarea>
        <label>Statut</label>
        <select id="project-status">
          <option value="pending">En attente</option>
          <option value="in_progress">En cours</option>
          <option value="completed">Terminé</option>
          <option value="cancelled">Annulé</option>
        </select>
        <label>Date d'échéance</label><input type="date" id="project-due"/>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let currentUser=null;
    function statusLabel(s){var m={pending:"En attente",in_progress:"En cours",completed:"Terminé",cancelled:"Annulé"};return m[s]||s}
    function escapeHtml(str){if(!str)return"";return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function formatMoney(n){return Number(n||0).toLocaleString("fr-FR")}
    async function loadClientsForSelect(){
      const{data}=await supabaseClient.from("clients").select("id, name").eq("user_id",currentUser.id).order("name");
      var select=document.getElementById("project-client");
      select.innerHTML='<option value="">— Aucun —</option>'+(data||[]).map(function(c){return'<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'}).join("")
    }
    function openModal(project){
      document.getElementById("modal-error").style.display="none";
      document.getElementById("project-id").value=project?project.id:"";
      document.getElementById("modal-title").textContent=project?"Modifier le projet":"Nouveau projet";
      document.getElementById("project-title").value=project?project.title:"";
      document.getElementById("project-client").value=project&&project.client_id?project.client_id:"";
      document.getElementById("project-amount").value=project?(project.amount||0):0;
      document.getElementById("project-paid").value=project?(project.amount_paid||0):0;
      document.getElementById("project-description").value=project&&project.description?project.description:"";
      document.getElementById("project-status").value=project&&project.status?project.status:"pending";
      document.getElementById("project-due").value=project&&project.due_date?project.due_date:"";
      document.getElementById("modal").classList.add("open")
    }
    function closeModal(){document.getElementById("modal").classList.remove("open")}
    async function loadProjects(){
      const{data,error}=await supabaseClient.from("projects").select("*, clients(name)").eq("user_id",currentUser.id).order("created_at",{ascending:false});
      document.getElementById("loading").style.display="none";
      if(error){document.getElementById("error").textContent=error.message;document.getElementById("error").style.display="block";return}
      var tbody=document.getElementById("projects-tbody"),empty=document.getElementById("empty"),tableWrap=document.getElementById("table-wrap");
      if(!data||data.length===0){tableWrap.style.display="none";empty.style.display="block";return}
      empty.style.display="none";tableWrap.style.display="block";
      tbody.innerHTML=data.map(function(p){
        var total=Number(p.amount||0),paid=Number(p.amount_paid||0),reste=total-paid;
        var clientName=p.clients?p.clients.name:"—";
        var resteClass=reste<=0?"reste reste-ok":"reste";
        return"<tr><td><strong>"+escapeHtml(p.title)+"</strong></td><td>"+escapeHtml(clientName)+"</td><td>"+formatMoney(total)+"</td><td>"+formatMoney(paid)+"</td><td class=\""+resteClass+"\">"+formatMoney(reste)+"</td><td><span class=\"badge badge-"+p.status+"\">"+statusLabel(p.status)+"</span></td><td><button class=\"btn btn-secondary btn-sm\" onclick='editProject("+JSON.stringify(p).replace(/'/g,"&#39;")+")'>Modifier</button> <button class=\"btn btn-danger btn-sm\" onclick=\"deleteProject('"+p.id+"')\">Suppr.</button></td></tr>"
      }).join("")
    }
    function editProject(project){openModal(project)}
    async function deleteProject(id){if(!confirm("Supprimer ce projet ?"))return;const{error}=await supabaseClient.from("projects").delete().eq("id",id);if(error){alert(error.message);return}loadProjects()}
    document.getElementById("btn-add").addEventListener("click",function(){openModal(null)});
    document.getElementById("btn-add-empty").addEventListener("click",function(){openModal(null)});
    document.getElementById("btn-cancel").addEventListener("click",closeModal);
    document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
    document.getElementById("project-form").addEventListener("submit",async function(e){
      e.preventDefault();
      var id=document.getElementById("project-id").value;
      var total=Number(document.getElementById("project-amount").value)||0;
      var paid=Number(document.getElementById("project-paid").value)||0;
      var errEl=document.getElementById("modal-error");errEl.style.display="none";
      if(paid>total){errEl.textContent="Le montant avancé ne peut pas dépasser le montant total.";errEl.style.display="block";return}
      var payload={title:document.getElementById("project-title").value.trim(),client_id:document.getElementById("project-client").value||null,amount:total,amount_paid:paid,description:document.getElementById("project-description").value.trim()||null,status:document.getElementById("project-status").value,due_date:document.getElementById("project-due").value||null,user_id:currentUser.id};
      if(!id){var res=await supabaseClient.from("projects").select("*",{count:"exact",head:true}).eq("user_id",currentUser.id);if(res.count>=3){errEl.textContent="Plan Free limité à 3 projets.";errEl.style.display="block";return}}
      var error;if(id){var r=await supabaseClient.from("projects").update(payload).eq("id",id);error=r.error}else{var r2=await supabaseClient.from("projects").insert(payload);error=r2.error}
      if(error){errEl.textContent=error.message;errEl.style.display="block";return}
      closeModal();loadProjects()
    });
    document.getElementById("logout-btn").addEventListener("click",async function(){await supabaseClient.auth.signOut();window.location.href="login.html"});
    (async function(){
      const{data:{session}}=await supabaseClient.auth.getSession();
      if(!session){window.location.href="login.html";return}
      currentUser=session.user;
      await loadClientsForSelect();
      loadProjects()
    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
