<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clients — ClientFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
    .navbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 1rem;height:3.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .logo{font-size:1.25rem;font-weight:700;text-decoration:none;color:inherit}
    .logo span{color:#4f46e5}
    .nav-links{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
    .nav-links a{font-size:.75rem;color:#64748b;text-decoration:none;padding:.2rem .3rem}
    .btn{padding:.45rem .75rem;border-radius:.5rem;font-size:.75rem;font-weight:500;border:none;cursor:pointer;font-family:inherit}
    .btn-primary{background:#4f46e5;color:#fff}
    .btn-secondary{background:#fff;border:1px solid #e2e8f0;color:#334155}
    .btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .btn-sm{padding:.3rem .55rem;font-size:.7rem}
    main{max-width:56rem;margin:0 auto;padding:1.25rem 1rem 3rem}
    .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
    h1{font-size:1.4rem}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:.8rem}
    th,td{text-align:left;padding:.7rem .6rem;border-bottom:1px solid #e2e8f0}
    th{background:#f8fafc;color:#64748b;font-weight:500}
    .empty{text-align:center;padding:2.5rem 1rem;color:#64748b}
    .empty .icon{font-size:2rem;margin-bottom:.75rem}
    .badge{display:inline-block;padding:.15rem .45rem;border-radius:9999px;font-size:.7rem;font-weight:500}
    .badge-active{background:#dbeafe;color:#1d4ed8}
    .badge-prospect{background:#f3e8ff;color:#7c3aed}
    .badge-inactive{background:#fee2e2;color:#b91c1c}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:.75rem;width:100%;max-width:26rem;max-height:90vh;overflow-y:auto;padding:1.5rem}
    .modal h2{font-size:1.2rem;margin-bottom:1.1rem}
    label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.3rem;color:#334155}
    input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:.9rem;margin-bottom:.9rem;font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    .modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem}
    .error{background:#fef2f2;color:#dc2626;padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem;display:none}
  </style>
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="logo">Client<span>Flow</span></a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="projects.html">Projets</a>
      <a href="finances.html">Finances</a>
      <button class="btn btn-secondary btn-sm" id="logout-btn">Déconnexion</button>
    </div>
  </header>
  <main>
    <div class="page-header">
      <h1>Clients</h1>
      <button class="btn btn-primary" id="btn-add">+ Ajouter un client</button>
    </div>
    <div id="error" class="error"></div>
    <div class="card">
      <div id="loading" style="padding:2rem;text-align:center;color:#64748b">Chargement...</div>
      <div id="table-wrap" style="display:none;overflow-x:auto">
        <table>
          <thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody id="clients-tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="display:none">
        <div class="icon">👥</div>
        <h3>Aucun client</h3>
        <p>Ajoutez votre premier client pour commencer.</p>
        <button class="btn btn-primary" id="btn-add-empty" style="margin-top:1rem">+ Ajouter un client</button>
      </div>
    </div>
  </main>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Ajouter un client</h2>
      <div id="modal-error" class="error"></div>
      <form id="client-form">
        <input type="hidden" id="client-id"/>
        <label>Nom *</label><input type="text" id="client-name" required/>
        <label>Email</label><input type="email" id="client-email"/>
        <label>Téléphone</label><input type="text" id="client-phone"/>
        <label>Entreprise</label><input type="text" id="client-company"/>
        <label>Statut</label>
        <select id="client-status">
          <option value="active">Actif</option>
          <option value="prospect">Prospect</option>
          <option value="inactive">Inactif</option>
        </select>
        <label>Notes</label><textarea id="client-notes" rows="3"></textarea>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let currentUser=null;
    function statusLabel(s){if(s==="active")return"Actif";if(s==="prospect")return"Prospect";if(s==="inactive")return"Inactif";return s}
    function escapeHtml(str){if(!str)return"";return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function openModal(client){
      document.getElementById("modal-error").style.display="none";
      document.getElementById("client-id").value=client?client.id:"";
      document.getElementById("modal-title").textContent=client?"Modifier le client":"Ajouter un client";
      document.getElementById("client-name").value=client?client.name:"";
      document.getElementById("client-email").value=client&&client.email?client.email:"";
      document.getElementById("client-phone").value=client&&client.phone?client.phone:"";
      document.getElementById("client-company").value=client&&client.company?client.company:"";
      document.getElementById("client-status").value=client&&client.status?client.status:"active";
      document.getElementById("client-notes").value=client&&client.notes?client.notes:"";
      document.getElementById("modal").classList.add("open");
    }
    function closeModal(){document.getElementById("modal").classList.remove("open")}
    async function loadClients(){
      const{data,error}=await supabaseClient.from("clients").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
      document.getElementById("loading").style.display="none";
      if(error){document.getElementById("error").textContent=error.message;document.getElementById("error").style.display="block";return}
      var tbody=document.getElementById("clients-tbody"),empty=document.getElementById("empty"),tableWrap=document.getElementById("table-wrap");
      if(!data||data.length===0){tableWrap.style.display="none";empty.style.display="block";return}
      empty.style.display="none";tableWrap.style.display="block";
      tbody.innerHTML=data.map(function(c){
        return"<tr><td><strong>"+escapeHtml(c.name)+"</strong>"+(c.company?"<br><small style='color:#64748b'>"+escapeHtml(c.company)+"</small>":"")+"</td><td>"+escapeHtml(c.email||"—")+"</td><td>"+escapeHtml(c.phone||"—")+"</td><td><span class=\"badge badge-"+c.status+"\">"+statusLabel(c.status)+"</span></td><td><button class=\"btn btn-secondary btn-sm\" onclick='editClient("+JSON.stringify(c)+")'>Modifier</button> <button class=\"btn btn-danger btn-sm\" onclick=\"deleteClient('"+c.id+"')\">Suppr.</button></td></tr>"
      }).join("")
    }
    function editClient(client){openModal(client)}
    async function deleteClient(id){
      if(!confirm("Supprimer ce client ?"))return;
      const{error}=await supabaseClient.from("clients").delete().eq("id",id);
      if(error){alert(error.message);return}
      loadClients()
    }
    document.getElementById("btn-add").addEventListener("click",function(){openModal(null)});
    document.getElementById("btn-add-empty").addEventListener("click",function(){openModal(null)});
    document.getElementById("btn-cancel").addEventListener("click",closeModal);
    document.getElementById("modal").addEventListener("click",function(e){if(e.target.id==="modal")closeModal()});
    document.getElementById("client-form").addEventListener("submit",async function(e){
      e.preventDefault();
      var id=document.getElementById("client-id").value;
      var payload={name:document.getElementById("client-name").value.trim(),email:document.getElementById("client-email").value.trim()||null,phone:document.getElementById("client-phone").value.trim()||null,company:document.getElementById("client-company").value.trim()||null,status:document.getElementById("client-status").value,notes:document.getElementById("client-notes").value.trim()||null,user_id:currentUser.id};
      var errEl=document.getElementById("modal-error");errEl.style.display="none";
      if(!id){var res=await supabaseClient.from("clients").select("*",{count:"exact",head:true}).eq("user_id",currentUser.id);if(res.count>=10){errEl.textContent="Plan Free limité à 10 clients.";errEl.style.display="block";return}}
      var error;if(id){var r=await supabaseClient.from("clients").update(payload).eq("id",id);error=r.error}else{var r2=await supabaseClient.from("clients").insert(payload);error=r2.error}
      if(error){errEl.textContent=error.message;errEl.style.display="block";return}
      closeModal();loadClients()
    });
    document.getElementById("logout-btn").addEventListener("click",async function(){await supabaseClient.auth.signOut();window.location.href="login.html"});
    (async function(){
      const{data:{session}}=await supabaseClient.auth.getSession();
      if(!session){window.location.href="login.html";return}
      currentUser=session.user;loadClients()
    })();
  </script>
</body>
</html>
