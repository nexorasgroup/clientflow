<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients — ClientFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }
    .navbar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 1.25rem;
      height: 3.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 1.25rem; font-weight: 700; text-decoration: none; color: inherit; }
    .logo span { color: #4f46e5; }
    .btn {
      padding: 0.5rem 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-secondary { background: white; border: 1px solid #e2e8f0; color: #334155; }
    .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.75rem; }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    h1 { font-size: 1.5rem; }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 500;
    }
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #64748b;
    }
    .empty .icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-active { background: #dbeafe; color: #1d4ed8; }
    .badge-prospect { background: #f3e8ff; color: #7c3aed; }
    .badge-inactive { background: #fee2e2; color: #b91c1c; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 26rem;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .modal h2 { font-size: 1.25rem; margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: #334155;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .nav-links {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .nav-links a {
      font-size: 0.8125rem;
      color: #64748b;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="logo">Client<span>Flow</span></a>
    <div class="nav-links">
      <a href="dashboard.html">Tableau de bord</a>
      <button class="btn btn-secondary btn-sm" id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <main>
    <div class="page-header">
      <h1>Clients</h1>
      <button class="btn btn-primary" id="btn-add">+ Ajouter un client</button>
    </div>

    <div id="error" class="error"></div>

    <div class="card">
      <div id="loading" style="padding:2rem;text-align:center;color:#64748b">Chargement...</div>
      <div id="table-wrap" style="display:none; overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="clients-tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="display:none">
        <div class="icon">👥</div>
        <h3>Aucun client</h3>
        <p>Ajoutez votre premier client pour commencer.</p>
        <button class="btn btn-primary" id="btn-add-empty" style="margin-top:1rem">+ Ajouter un client</button>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Ajouter un client</h2>
      <div id="modal-error" class="error"></div>
      <form id="client-form">
        <input type="hidden" id="client-id" />
        <label>Nom *</label>
        <input type="text" id="client-name" required />
        <label>Email</label>
        <input type="email" id="client-email" />
        <label>Téléphone</label>
        <input type="text" id="client-phone" />
        <label>Entreprise</label>
        <input type="text" id="client-company" />
        <label>Statut</label>
        <select id="client-status">
          <option value="active">Actif</option>
          <option value="prospect">Prospect</option>
          <option value="inactive">Inactif</option>
        </select>
        <label>Notes</label>
        <textarea id="client-notes" rows="3"></textarea>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;

    function statusLabel(s) {
      if (s === "active") return "Actif";
      if (s === "prospect") return "Prospect";
      if (s === "inactive") return "Inactif";
      return s;
    }

    function openModal(client = null) {
      document.getElementById("modal-error").style.display = "none";
      document.getElementById("client-id").value = client ? client.id : "";
      document.getElementById("modal-title").textContent = client ? "Modifier le client" : "Ajouter un client";
      document.getElementById("client-name").value = client ? client.name : "";
      document.getElementById("client-email").value = client ? (client.email || "") : "";
      document.getElementById("client-phone").value = client ? (client.phone || "") : "";
      document.getElementById("client-company").value = client ? (client.company || "") : "";
      document.getElementById("client-status").value = client ? (client.status || "active") : "active";
      document.getElementById("client-notes").value = client ? (client.notes || "") : "";
      document.getElementById("modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
    }

    async function loadClients() {
      const { data, error } = await supabaseClient
        .from("clients")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      document.getElementById("loading").style.display = "none";

      if (error) {
        document.getElementById("error").textContent = error.message;
        document.getElementById("error").style.display = "block";
        return;
      }

      const tbody = document.getElementById("clients-tbody");
      const empty = document.getElementById("empty");
      const tableWrap = document.getElementById("table-wrap");

      if (!data || data.length === 0) {
        tableWrap.style.display = "none";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      tableWrap.style.display = "block";

      tbody.innerHTML = data.map(c => `
        <tr>
          <td>
            <strong>${escapeHtml(c.name)}</strong>
            ${c.company ? "<br><small style='color:#64748b'>" + escapeHtml(c.company) + "</small>" : ""}
          </td>
          <td>${escapeHtml(c.email || "—")}</td>
          <td>${escapeHtml(c.phone || "—")}</td>
          <td><span class="badge badge-${c.status}">${statusLabel(c.status)}</span></td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick='editClient(${JSON.stringify(c)})'>Modifier</button>
            <button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">Suppr.</button>
          </td>
        </tr>
      `).join("");
    }

    function editClient(client) {
      openModal(client);
    }

    async function deleteClient(id) {
      if (!confirm("Supprimer ce client ?")) return;
      const { error } = await supabaseClient.from("clients").delete().eq("id", id);
      if (error) {
        alert(error.message);
        return;
      }
      loadClients();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("btn-add").addEventListener("click", () => openModal());
    document.getElementById("btn-add-empty").addEventListener("click", () => openModal());
    document.getElementById("btn-cancel").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    document.getElementById("client-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("client-id").value;
      const payload = {
        name: document.getElementById("client-name").value.trim(),
        email: document.getElementById("client-email").value.trim() || null,
        phone: document.getElementById("client-phone").value.trim() || null,
        company: document.getElementById("client-company").value.trim() || null,
        status: document.getElementById("client-status").value,
        notes: document.getElementById("client-notes").value.trim() || null,
        user_id: currentUser.id
      };

      const errEl = document.getElementById("modal-error");
      errEl.style.display = "none";

      // Limite Free : 10 clients
      if (!id) {
        const { count } = await supabaseClient
          .from("clients")
          .select("*", { count: "exact", head: true })
          .eq("user_id", currentUser.id);
        if (count >= 10) {
          errEl.textContent = "Plan Free limité à 10 clients.";
          errEl.style.display = "block";
          return;
        }
      }

      let error;
      if (id) {
        const res = await supabaseClient.from("clients").update(payload).eq("id", id);
        error = res.error;
      } else {
        const res = await supabaseClient.from("clients").insert(payload);
        error = res.error;
      }

      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = "block";
        return;
      }

      closeModal();
      loadClients();
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });

    (async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      currentUser = session.user;
      loadClients();
    })();
  </script>
</body>
</html>
