<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — ClientFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }
    .navbar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 1.25rem;
      height: 3.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .logo span { color: #4f46e5; }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .user-name {
      font-size: 0.875rem;
      color: #64748b;
    }
    .btn {
      padding: 0.5rem 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-secondary {
      background: white;
      border: 1px solid #e2e8f0;
      color: #334155;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover { background: #4338ca; }
    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.875rem;
      margin-bottom: 1.75rem;
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    .stat-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .stat-card h3 {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    .stat-card p {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
      margin-bottom: 1.75rem;
    }
    .empty {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 2.5rem 1.25rem;
      text-align: center;
    }
    .empty .icon { font-size: 2.25rem; margin-bottom: 0.75rem; }
    .empty h3 { margin-bottom: 0.5rem; }
    .empty p {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Client<span>Flow</span></div>
    <div class="nav-right">
      <span class="user-name" id="user-name">...</span>
      <button class="btn btn-secondary" id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Chargement...</div>

    <div id="content" style="display:none">
      <h1 id="welcome">Bonjour 👋</h1>
      <p class="subtitle">Voici un aperçu de votre activité.</p>

      <div class="stats">
        <div class="stat-card">
          <h3>Clients</h3>
          <p id="stat-clients">0</p>
        </div>
        <div class="stat-card">
          <h3>Projets</h3>
          <p id="stat-projects">0</p>
        </div>
        <div class="stat-card">
          <h3>En cours</h3>
          <p id="stat-active">0</p>
        </div>
        <div class="stat-card">
          <h3>Revenus</h3>
          <p id="stat-revenue">0</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="alert('Bientôt disponible : gestion des clients')">+ Ajouter un client</button>
        <button class="btn btn-secondary" onclick="alert('Bientôt disponible : gestion des projets')">+ Nouveau projet</button>
      </div>

      <div class="empty" id="empty-state">
        <div class="icon">🚀</div>
        <h3>Bienvenue sur ClientFlow !</h3>
        <p>Votre compte est créé. La gestion des clients et projets arrive à la prochaine étape.</p>
      </div>
    </div>
  </main>

  <script>
    (async function init() {
      // Vérifier la session
      const { data: { session }, error } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const user = session.user;
      const fullName = user.user_metadata?.full_name || user.email;
      const firstName = fullName.split(" ")[0];

      document.getElementById("user-name").textContent = fullName;
      document.getElementById("welcome").textContent = `Bonjour, ${firstName} 👋`;

      // Afficher le contenu
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";

      // Déconnexion
      document.getElementById("logout-btn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = "login.html";
      });
    })();
  </script>
</body>
</html>
