<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon profil — ClientFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
    .navbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 1rem;height:3.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
    .logo{font-size:1.25rem;font-weight:700;text-decoration:none;color:inherit}
    .logo span{color:#4f46e5}
    .menu-toggle{display:none;background:none;border:1px solid #e2e8f0;border-radius:.5rem;padding:.35rem .6rem;font-size:1.1rem;cursor:pointer}
    .nav-menu{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
    .nav-menu a{font-size:.72rem;color:#64748b;text-decoration:none;padding:.2rem .3rem}
    .btn{padding:.5rem .85rem;border-radius:.5rem;font-size:.8rem;font-weight:500;border:none;cursor:pointer;font-family:inherit}
    .btn-primary{background:#4f46e5;color:#fff}
    .btn-secondary{background:#fff;border:1px solid #e2e8f0;color:#334155}
    main{max-width:32rem;margin:0 auto;padding:1.25rem 1rem 3rem}
    h1{font-size:1.4rem;margin-bottom:.25rem}
    .subtitle{color:#64748b;font-size:.875rem;margin-bottom:1.25rem}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:.75rem;padding:1.25rem;margin-bottom:1rem}
    .card h2{font-size:1.05rem;margin-bottom:1rem}
    label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.3rem;color:#334155}
    input{width:100%;padding:.65rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:.9rem;margin-bottom:.9rem;font-family:inherit}
    input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
    input:disabled{background:#f1f5f9;color:#64748b}
    .optional{font-weight:400;color:#94a3b8;font-size:.75rem}
    .msg{padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem;display:none}
    .msg-ok{background:#ecfdf5;color:#047857}
    .msg-err{background:#fef2f2;color:#dc2626}
    .loading{text-align:center;padding:3rem;color:#64748b}
    .show-password{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;font-size:.875rem;color:#64748b}
    .show-password input{width:auto;margin:0}
    @media(max-width:768px){
      .menu-toggle{display:block}
      .nav-menu{display:none;position:absolute;top:3.75rem;left:0;right:0;background:#fff;border-bottom:1px solid #e2e8f0;flex-direction:column;align-items:stretch;padding:.5rem 0;z-index:40}
      .nav-menu.open{display:flex}
      .nav-menu a{padding:.75rem 1.25rem;font-size:.9rem;border-bottom:1px solid #f1f5f9}
      .nav-menu .btn{margin:.5rem 1.25rem;width:calc(100% - 2.5rem);justify-content:center}
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="logo">Client<span>Flow</span></a>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">Accueil</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="clients.html">Clients</a>
      <a href="projects.html">Projets</a>
      <a href="finances.html">Finances</a>
      <a href="profile.html">Profil</a>
      <a href="plan.html">Plan</a>
      <button class="btn btn-secondary" id="logout-btn">Déconnexion</button>
    </nav>
  </header>
  <main>
    <div id="loading" class="loading">Chargement...</div>
    <div id="content" style="display:none">
      <h1>Mon profil</h1>
      <p class="subtitle">Vos informations et sécurité du compte.</p>
      <div id="msg-ok" class="msg msg-ok"></div>
      <div id="msg-err" class="msg msg-err"></div>
      <div class="card">
        <h2>Informations</h2>
        <form id="profile-form">
          <label>Nom *</label><input type="text" id="last-name" required/>
          <label>Prénoms *</label><input type="text" id="first-name" required/>
          <label>Contact (téléphone) *</label><input type="tel" id="phone" required/>
          <label>Activité *</label><input type="text" id="activity" required/>
          <label>Situation géographique <span class="optional">(optionnel)</span></label><input type="text" id="location"/>
          <label>Email</label><input type="email" id="email" disabled/>
          <label>Numéro IFU <span class="optional">(optionnel)</span></label><input type="text" id="ifu"/>
          <button type="submit" class="btn btn-primary" id="btn-save" style="width:100%;margin-top:.25rem">Enregistrer les modifications</button>
        </form>
      </div>
      <div id="msg-pwd-ok" class="msg msg-ok"></div>
      <div id="msg-pwd-err" class="msg msg-err"></div>
      <div class="card">
        <h2>Changer le mot de passe</h2>
        <form id="password-form">
          <label>Nouveau mot de passe *</label>
          <input type="password" id="new-password" required minlength="6" placeholder="Minimum 6 caractères"/>
          <label>Confirmer le mot de passe *</label>
          <input type="password" id="confirm-password" required minlength="6"/>
          <label class="show-password"><input type="checkbox" id="show-password"/> Afficher les mots de passe</label>
          <button type="submit" class="btn btn-primary" id="btn-pwd" style="width:100%">Mettre à jour le mot de passe</button>
        </form>
      </div>
    </div>
  </main>
  <script>
    const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let currentUser=null;
    async function init(){
      try{
        const{data:{session}}=await supabaseClient.auth.getSession();
        if(!session){window.location.href="login.html";return}
        currentUser=session.user;
        const{data:profile}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).single();
        const meta=currentUser.user_metadata||{};
        document.getElementById("last-name").value=(profile&&profile.last_name)||meta.last_name||"";
        document.getElementById("first-name").value=(profile&&profile.first_name)||meta.first_name||"";
        document.getElementById("phone").value=(profile&&profile.phone)||meta.phone||"";
        document.getElementById("activity").value=(profile&&profile.activity)||meta.activity||"";
        document.getElementById("location").value=(profile&&profile.location)||meta.location||"";
        document.getElementById("email").value=currentUser.email||"";
        document.getElementById("ifu").value=(profile&&profile.ifu)||meta.ifu||"";
        document.getElementById("loading").style.display="none";
        document.getElementById("content").style.display="block";
        document.getElementById("logout-btn").addEventListener("click",async function(){await supabaseClient.auth.signOut();window.location.href="login.html"})
      }catch(err){window.location.href="login.html"}
    }
    document.getElementById("show-password").addEventListener("change",function(){
      var t=this.checked?"text":"password";
      document.getElementById("new-password").type=t;
      document.getElementById("confirm-password").type=t;
    });
    document.getElementById("profile-form").addEventListener("submit",async function(e){
      e.preventDefault();
      var msgOk=document.getElementById("msg-ok"),msgErr=document.getElementById("msg-err"),btn=document.getElementById("btn-save");
      msgOk.style.display="none";msgErr.style.display="none";
      var firstName=document.getElementById("first-name").value.trim();
      var lastName=document.getElementById("last-name").value.trim();
      var phone=document.getElementById("phone").value.trim();
      var activity=document.getElementById("activity").value.trim();
      var location=document.getElementById("location").value.trim();
      var ifu=document.getElementById("ifu").value.trim();
      var fullName=firstName+" "+lastName;
      btn.disabled=true;btn.textContent="Enregistrement...";
      try{
        const{error}=await supabaseClient.from("profiles").upsert({id:currentUser.id,email:currentUser.email,full_name:fullName,first_name:firstName,last_name:lastName,phone:phone,activity:activity,location:location||null,ifu:ifu||null});
        if(error)throw error;
        await supabaseClient.auth.updateUser({data:{full_name:fullName,first_name:firstName,last_name:lastName,phone:phone,activity:activity,location:location||null,ifu:ifu||null}});
        msgOk.textContent="Profil mis à jour avec succès.";msgOk.style.display="block"
      }catch(err){msgErr.textContent=err.message||"Erreur.";msgErr.style.display="block"}
      btn.disabled=false;btn.textContent="Enregistrer les modifications"
    });
    document.getElementById("password-form").addEventListener("submit",async function(e){
      e.preventDefault();
      var msgOk=document.getElementById("msg-pwd-ok"),msgErr=document.getElementById("msg-pwd-err"),btn=document.getElementById("btn-pwd");
      msgOk.style.display="none";msgErr.style.display="none";
      var newPwd=document.getElementById("new-password").value;
      var confirmPwd=document.getElementById("confirm-password").value;
      if(newPwd.length<6){msgErr.textContent="Minimum 6 caractères.";msgErr.style.display="block";return}
      if(newPwd!==confirmPwd){msgErr.textContent="Les mots de passe ne correspondent pas.";msgErr.style.display="block";return}
      btn.disabled=true;btn.textContent="Mise à jour...";
      try{
        const{error}=await supabaseClient.auth.updateUser({password:newPwd});
        if(error)throw error;
        msgOk.textContent="Mot de passe mis à jour.";msgOk.style.display="block";
        document.getElementById("new-password").value="";document.getElementById("confirm-password").value=""
      }catch(err){msgErr.textContent=err.message||"Erreur.";msgErr.style.display="block"}
      btn.disabled=false;btn.textContent="Mettre à jour le mot de passe"
    });
    init();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
