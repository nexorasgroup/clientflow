<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte — ClientFlow</title>

    <meta
        name="description"
        content="Créez votre compte ClientFlow."
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- LOGO -->

            <div class="auth-logo">

                <a href="index.html">
                    Client<span>Flow</span>
                </a>

            </div>


            <!-- FORMULAIRE -->

            <div class="auth-card">

                <div class="auth-header">

                    <h1>
                        Créer votre compte
                    </h1>

                    <p>
                        Commencez à organiser votre activité avec ClientFlow.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- NOM -->

                    <div class="form-group">

                        <label for="name">
                            Nom complet
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Votre nom"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Adresse email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="vous@exemple.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- MOT DE PASSE -->

                    <div class="form-group">

                        <label for="password">
                            Mot de passe
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Minimum 6 caractères"
                                minlength="6"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('password', this)"
                                aria-label="Afficher le mot de passe"
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRMATION MOT DE PASSE -->

                    <div class="form-group">

                        <label for="password-confirm">
                            Confirmer le mot de passe
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password-confirm"
                                name="password-confirm"
                                placeholder="Répétez votre mot de passe"
                                minlength="6"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('password-confirm', this)"
                                aria-label="Afficher la confirmation du mot de passe"
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="registerMessage"
                        class="form-message"
                    ></div>


                    <!-- BOUTON -->

                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Créer mon compte
                    </button>

                </form>


                <!-- CONNEXION -->

                <div class="auth-footer">

                    <p>

                        Vous avez déjà un compte ?

                        <a href="login.html">
                            Se connecter
                        </a>

                    </p>

                </div>

            </div>


            <!-- RETOUR -->

            <div class="back-home">

                <a href="index.html">
                    ← Retour à l'accueil
                </a>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT POUR AFFICHER/MASQUER LE MOT DE PASSE -->

    <script>

        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

                button.setAttribute(
                    "aria-label",
                    "Masquer le mot de passe"
                );

            } else {

                input.type = "password";

                button.textContent = "👁️";

                button.setAttribute(
                    "aria-label",
                    "Afficher le mot de passe"
                );

            }

        }

    </script>

</body>

</html>
